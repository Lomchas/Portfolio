name: CI

# Se ejecuta en cada push a main y en cada Pull Request: si el build
# rompe, se sabe ANTES de que Vercel despliegue algo roto.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist (artifact de diagnóstico)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
